<!DOCTYPE html>
<html>
<head>
    <title>Book Availability</title>
</head>
<body>

<h1>Book Availability</h1>

{% if books %}

<table border="1" cellpadding="10">
    <tr>
        <th>Book ID</th>
        <th>Book Name</th>
        <th>Author</th>
        <th>Status</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book[0] }}</td>
        <td>{{ book[1] }}</td>
        <td>{{ book[2] }}</td>
        <td>{{ book[3] }}</td>
    </tr>
    {% endfor %}

</table>

{% else %}

<p>No books available.</p>

{% endif %}

<br>

<a href="/home">Back to Home</a>

</body>
</html>
