<!DOCTYPE html>
<html>
<head>
    <title>Return Book</title>
</head>
<body>

<h1>Return Book</h1>

<form method="POST">

    <label>Book ID:</label>
    <input type="text" name="book_id" required>

    <br><br>

    <button type="submit">Return Book</button>

</form>

{% if student_name %}

<hr>

<h2>Book Returned Successfully!</h2>

<p><b>Student Name:</b> {{ student_name }}</p>

<p><b>Book ID:</b> {{ book_id }}</p>

<p><b>Late Days:</b> {{ late_days }}</p>

<p><b>Fine:</b> ₹{{ fine }}</p>

{% elif message %}

<h3>{{ message }}</h3>

{% endif %}

<br>

<a href="/home">Back to Home</a>

</body>
</html>
